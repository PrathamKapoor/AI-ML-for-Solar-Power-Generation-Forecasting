# =============================================================================
# Model configurations
# =============================================================================
# Every architecture is specified here rather than in code, so a run is
# reproducible from configuration alone. Sizes were chosen to be trainable on CPU
# within a reasonable time while still being representative of each family: the
# point of the study is a controlled comparison, not a leaderboard, and a
# transformer scaled to the data is sufficient to test whether attention helps.

# -----------------------------------------------------------------------------
# Neural architectures
# -----------------------------------------------------------------------------
neural:
  lstm:
    hidden_size: 96
    n_layers: 1
    dropout: 0.15
  gru:
    hidden_size: 96
    n_layers: 1
    dropout: 0.15
  cnn_lstm:
    hidden_size: 96
    n_filters: 48
    kernel_size: 5
    dropout: 0.15
  attention_lstm:
    hidden_size: 96
    attention_size: 48
    dropout: 0.15
  transformer:
    d_model: 64
    n_heads: 4
    n_layers: 2
    dim_feedforward: 128
    dropout: 0.15

# -----------------------------------------------------------------------------
# Training protocol, shared by every neural model
# -----------------------------------------------------------------------------
# The loss is MAE on the standardised target. Early stopping monitors validation
# MAE *in watts* so that the stopping criterion is expressed in the same unit as
# the reported metrics, and the best weights (not the last weights) are restored.
training:
  epochs: 70
  batch_size: 256
  eval_batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 14
  device: "cpu"
  verbose: false

# -----------------------------------------------------------------------------
# Classical estimators
# -----------------------------------------------------------------------------
classical:
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    # 0.3 rather than the 0.5 default: the flattened window is 24 x 32 = 768
    # columns that are strongly correlated with each other, so considering half
    # of them at every split adds cost without adding information.
    max_features: 0.3
    n_jobs: -1
  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3
    min_samples_leaf: 20
    early_stopping: false
  xgboost:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.9
    colsample_bytree: 0.6
    reg_lambda: 1.0
    reg_alpha: 0.0
    min_child_weight: 1
    tree_method: "hist"
    n_jobs: -1
  mlp:
    hidden_layer_sizes: [128, 64]
    learning_rate_init: 0.001
    max_iter: 400
    early_stopping: true
    n_iter_no_change: 15

# -----------------------------------------------------------------------------
# Hyperparameter grids
# -----------------------------------------------------------------------------
# Searched on the VALIDATION split only and refitted on the TRAINING split.
# The test split is never passed to the search. The grids are deliberately
# small: the aim is to give each family a fair chance rather than to find the
# single best configuration, and a large grid would make the comparison a
# measure of tuning budget.
tuning:
  random_forest:
    grid:
      max_depth: [8, 16, null]
      min_samples_leaf: [1, 4]
  gradient_boosting:
    grid:
      learning_rate: [0.03, 0.1]
      max_depth: [3, 6]
  xgboost:
    grid:
      learning_rate: [0.03, 0.1]
      max_depth: [4, 6]
  mlp:
    grid:
      hidden_layer_sizes: [[64], [128, 64], [256, 128]]
