name: solar-pv-forecasting
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - numpy=2.5.2
  - pandas=2.3.3
  - pyarrow=25.0.1
  - scipy=1.17.1
  - scikit-learn=1.9.0
  - statsmodels=0.14.6
  - matplotlib=3.10.3
  - seaborn=0.13.2
  - pyyaml=6.0.2
  - joblib=1.5.3
  - tqdm=4.70.0
  - requests=2.33.1
  - pytest=9.1.1
  - pip:
      # torch and xgboost are pip-installed: the conda-forge torch build is
      # large and the CPU wheel is sufficient for the reported experiments.
      - torch==2.13.0
      - xgboost==3.4.1
      - pvlib==0.15.2
      - shap==0.52.0
      - openpyxl==3.1.5
